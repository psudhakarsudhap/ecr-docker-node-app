name: Build and push Docker image to ECR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check application syntax
        run: node --check server.js

      - name: Verify deployment settings
        run: |
          test -n "$AWS_REGION" || { echo "Set the AWS_REGION repository variable."; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Set the ECR_REPOSITORY repository variable."; exit 1; }
          test -n "$AWS_ROLE_TO_ASSUME" || { echo "Set the AWS_ROLE_TO_ASSUME repository secret."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get ECR registry
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Create ECR repository if needed
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 ||
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION" >/dev/null

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --tag "$image:latest" \
            --tag "$image:$GITHUB_SHA" \
            .
          docker push "$image:latest"
          docker push "$image:$GITHUB_SHA"
